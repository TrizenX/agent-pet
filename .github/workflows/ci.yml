name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Invariant I5: pet-core must contain zero hardcoded agent knowledge.
      - run: pnpm lint:no-agent-strings
      - run: pnpm test
      # The plugin ships a copy of what the adapter generates.
      - run: node scripts/generate-hooks-json.mjs --check

  spike-tools:
    # Every harness under tools/, compiled. The job used to check two Spike D
    # scripts, with a comment saying the point was to stop them rotting between
    # milestones — which is just as true of the invariant suite, the layout
    # checks, the load smoke and the soak, none of which were covered. A syntax
    # error in a harness nobody has run this month would otherwise surface the
    # next time someone needed it, which is the worst moment.
    #
    # `py_compile` does not execute imports, so the macOS-only ones (Quartz,
    # pyobjc) are checked here too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: Compile every tool
        run: |
          found=$(find tools -name '*.py' -not -path '*/__pycache__/*' | sort)
          test -n "$found" || { echo "no tools found — this check would pass vacuously"; exit 1; }
          echo "$found" | sed 's/^/  /'
          echo "$found" | xargs -n1 python3 -m py_compile

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/pet-core/src-tauri
      # `tauri-build` reads frontendDist at compile time and fails if it is
      # missing, but `cargo test` needs no real frontend. This was a stale Vite
      # build committed to the repo, which satisfied the check by accident and
      # showed up as a modified file after every local build. Generated here
      # instead, so nothing under dist/ is tracked.
      - name: Placeholder frontend for tauri-build
        run: |
          mkdir -p packages/pet-core/dist
          printf '<!doctype html><title>placeholder</title>' > packages/pet-core/dist/index.html
      - run: cargo fmt --manifest-path packages/pet-core/src-tauri/Cargo.toml -- --check
      # I1 and I2 are enforced by these tests; they are not optional.
      - run: cargo test --manifest-path packages/pet-core/src-tauri/Cargo.toml
