name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Invariant I5: pet-core must contain zero hardcoded agent knowledge.
      - run: pnpm lint:no-agent-strings
      - run: pnpm test
      # The plugin ships a copy of what the adapter generates.
      - run: node scripts/generate-hooks-json.mjs --check

  spike-tools:
    # The Spike D scripts are the source of truth for the atlas layout; keep
    # them at least importable so they do not rot between milestones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: |
          python3 -m py_compile tools/spike-atlas/derive_atlas.py
          python3 -m py_compile tools/spike-atlas/verify_rows.py

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/pet-core/src-tauri
      # `tauri-build` reads frontendDist at compile time and fails if it is
      # missing, but `cargo test` needs no real frontend. This was a stale Vite
      # build committed to the repo, which satisfied the check by accident and
      # showed up as a modified file after every local build. Generated here
      # instead, so nothing under dist/ is tracked.
      - name: Placeholder frontend for tauri-build
        run: |
          mkdir -p packages/pet-core/dist
          printf '<!doctype html><title>placeholder</title>' > packages/pet-core/dist/index.html
      - run: cargo fmt --manifest-path packages/pet-core/src-tauri/Cargo.toml -- --check
      # I1 and I2 are enforced by these tests; they are not optional.
      - run: cargo test --manifest-path packages/pet-core/src-tauri/Cargo.toml
