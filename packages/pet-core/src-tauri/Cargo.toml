[package]
name = "agent-pet"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
description = "Agent Pet — desktop companion for a running AI coding agent"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what enables a transparent NSWindow. See the App Store
# note in artifacts/spike-a/FINDINGS.md — this flag has distribution consequences.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# Tauri already runs tokio; this pulls in the pieces we use, not a second runtime.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
